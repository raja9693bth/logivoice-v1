name: CI

on:
  push:
    branches: [main, master, 'fix/**', 'feat/**', 'chore/**']
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Typecheck, Test, DB Integration & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run linter
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run automated test suite with coverage
        run: npm run test:coverage

      - name: Run database migration & integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/postgres

      - name: Verify production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E Smoke Tests
        run: npm run test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          PLAYWRIGHT_TEST: '1'

      - name: Run Production-Mode Auth E2E Tests
        run: npm run test:e2e:prod
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NODE_ENV: 'production'
